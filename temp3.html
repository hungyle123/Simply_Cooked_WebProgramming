<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layout 3 - Grid Layout</title>
  <style>
    body { margin: 0; font-family: "Segoe UI", sans-serif; }
    header { background: #ff6b6b; color: white; padding: 1rem; text-align: center; }
    nav { background: #1e1e2f; color: white; display: flex; justify-content: center; gap: 2rem; padding: 1rem; }
    nav a { color: white; text-decoration: none; }
    nav a:hover { border-bottom: 2px solid yellow; }

    .container {
      display: grid;
      grid-template-columns: 1fr 3fr;
      gap: 1rem;
      padding: 1rem;
    }
    aside {
      background: #f1f1f1;
      padding: 1rem;
      border-radius: 8px;
    }
    main {
      background: #fafafa;
      padding: 1rem;
      border-radius: 8px;
      min-height: 300px;
    }
    footer { background: #222; color: white; text-align: center; padding: 1rem; }

    /* Responsive */
    @media (max-width: 768px) {
      .container { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Grid Layout Website</h1>
  </header>

  <nav>
    <a href="#">Home</a>
    <a href="#">Products</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </nav>

  <div class="container">
    <aside>
      <h3>Sidebar</h3>
      <ul>
        <li><a href="#">Menu 1</a></li>
        <li><a href="#">Menu 2</a></li>
        <li><a href="#">Menu 3</a></li>
      </ul>
    </aside>

    <main>
      <h2>Welcome</h2>
      <p>This layout uses <strong>CSS Grid</strong> and is responsive.</p>
    </main>
  </div>

  <footer>
    <p>&copy; 2025 Web Programming</p>
  </footer>
</body>
</html>
